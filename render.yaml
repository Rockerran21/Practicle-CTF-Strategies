services:
  - type: web
    name: operation-ghost-route
    runtime: python
    plan: free
    rootDir: network-analysis/operation-ghost-route
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GHOST_ROUTE_SECRET
        generateValue: true
