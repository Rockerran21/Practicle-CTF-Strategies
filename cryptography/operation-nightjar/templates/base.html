<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OPERATION NIGHTJAR{% endblock %}</title>
  <!-- analyst log: the courier chained the intercepts. begin at /brief -->
  <style>
    :root{
      --bg:#0a0e0a; --panel:#0f150f; --line:#1c2a1c;
      --fg:#c8f7c8; --dim:#5f8f5f; --accent:#39ff14; --amber:#ffb000; --red:#ff5555;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
      line-height:1.55; padding:0;
    }
    .wrap{max-width:820px; margin:0 auto; padding:28px 18px 80px}
    header.bar{
      border-bottom:1px solid var(--line); padding:14px 18px;
      display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; background:rgba(10,14,10,.92); backdrop-filter:blur(4px);
    }
    header.bar a{color:var(--dim); text-decoration:none; font-size:13px}
    header.bar a:hover{color:var(--accent)}
    .logo{color:var(--accent); letter-spacing:3px; font-weight:700}
    h1{color:var(--accent); letter-spacing:2px; margin:.2em 0}
    h2{color:var(--amber); letter-spacing:1px; font-size:1.05rem; margin-top:1.8em}
    a{color:var(--accent)}
    .panel{
      background:var(--panel); border:1px solid var(--line);
      border-radius:8px; padding:18px 20px; margin:18px 0;
    }
    .blob{
      display:block; background:#060906; border:1px dashed var(--line);
      border-radius:6px; padding:14px; margin:12px 0; color:var(--accent);
      white-space:pre-wrap; word-break:break-all; font-size:13px; user-select:all;
    }
    .dim{color:var(--dim)}
    .amber{color:var(--amber)}
    .red{color:var(--red)}
    input[type=text]{
      width:100%; background:#060906; border:1px solid var(--line);
      color:var(--fg); padding:12px; border-radius:6px; font-family:inherit; font-size:15px;
    }
    button{
      margin-top:12px; background:var(--accent); color:#04120400; color:#041204;
      border:0; padding:11px 22px; border-radius:6px; font-weight:700;
      font-family:inherit; cursor:pointer; letter-spacing:1px;
    }
    button:hover{filter:brightness(1.15)}
    .ok{color:var(--accent); border-left:3px solid var(--accent); padding-left:12px}
    .err{color:var(--red); border-left:3px solid var(--red); padding-left:12px}
    details{margin:10px 0; border:1px solid var(--line); border-radius:6px; padding:8px 12px; background:#060906}
    summary{cursor:pointer; color:var(--amber)}
    .progress{display:flex; gap:8px; margin:6px 0 0}
    .pip{width:26px; height:8px; border-radius:4px; background:var(--line)}
    .pip.done{background:var(--accent)}
    .btnrow{margin-top:18px}
    .btnrow a{
      display:inline-block; text-decoration:none; border:1px solid var(--accent);
      color:var(--accent); padding:9px 18px; border-radius:6px; margin-right:10px
    }
    .btnrow a:hover{background:var(--accent); color:#041204}
    code{color:var(--amber)}
    footer{color:var(--dim); font-size:12px; border-top:1px solid var(--line); margin-top:40px; padding-top:14px}
  </style>
</head>
<body>
  <header class="bar">
    <span class="logo">// NIGHTJAR</span>
    <span>
      <a href="{{ url_for('index') }}">HOME</a> &nbsp;
      <a href="{{ url_for('brief') }}">BRIEF</a> &nbsp;
      <a href="{{ url_for('reset') }}">RESET</a>
    </span>
  </header>
  <div class="wrap">
    {% block body %}{% endblock %}
    <footer>
      Operation NIGHTJAR // authorized training exercise // solve the chain, recover the plan.
    </footer>
  </div>
</body>
</html>
